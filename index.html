<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website-uri calde și profesioniste pentru cei care lucrează cu copii." />
    <title>Website-uri pentru cei care lucrează cu copii</title>
    <style>
      :root { --navy: #152d57; --coral: #ed795f; --cream: #f8f3eb; --mint: #91b8ac; font-family: Arial, Helvetica, sans-serif; color: var(--navy); background: var(--cream); }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--cream); }
      img { max-width: 100%; }
      .hero { position: relative; min-height: 100svh; overflow: hidden; padding: 3.5rem 1.35rem 3rem; isolation: isolate; }
      .hero::before { position: absolute; z-index: -1; top: -8rem; right: -10rem; width: 22rem; height: 30rem; border-radius: 48% 52% 56% 44%; background: rgba(255, 255, 255, .72); content: ""; }
      .hero__content { position: relative; z-index: 1; max-width: 40rem; }
      .eyebrow { display: inline-block; margin: 0 0 1.8rem; font-size: .72rem; font-weight: 700; letter-spacing: .16em; line-height: 1.45; text-transform: uppercase; }
      .eyebrow::after { display: block; width: 9rem; height: .18rem; margin-top: .65rem; border-radius: 100%; background: var(--coral); content: ""; transform: rotate(-1deg); }
      h1 { max-width: 34rem; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.45rem, 11vw, 4rem); font-weight: 700; letter-spacing: -.055em; line-height: .94; }
      h1 span { color: var(--coral); }
      .hero__intro { max-width: 22rem; margin: 1.6rem 0 0; font-size: 1.05rem; line-height: 1.4; }
      .hero__intro::after { display: block; width: 8rem; height: .35rem; margin-top: 1.15rem; border-radius: 100%; background: var(--mint); content: ""; transform: rotate(-2deg); }
      .hero__visual { position: relative; z-index: 1; display: block; width: min(100%, 32rem); min-height: 19rem; margin: 2.25rem auto 0; border: 0; object-fit: contain; }
      .hero__heart { position: absolute; top: 8.5rem; right: 1.3rem; z-index: 2; width: 4.5rem; height: 4.5rem; object-fit: contain; }
      .hero__leaf { position: absolute; bottom: -1rem; left: -1rem; z-index: -1; width: 10rem; height: 10rem; object-fit: contain; opacity: .7; }
      @media (min-width: 700px) {
        .hero { display: grid; grid-template-columns: minmax(0, .82fr) minmax(26rem, 1.18fr); align-items: center; gap: 2rem; padding: 5rem clamp(3rem, 8vw, 8rem); }
        .hero__content { max-width: 38rem; }
        .eyebrow { margin-bottom: 2.5rem; font-size: .88rem; }
        h1 { font-size: clamp(3.25rem, 5.4vw, 5rem); }
        .hero__intro { margin-top: 2rem; font-size: 1.2rem; }
        .hero__visual { width: 100%; min-height: 34rem; margin: 0; }
        .hero__heart { top: 12%; right: 6%; width: 6rem; height: 6rem; }
        .hero__leaf { width: 16rem; height: 16rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__content">
          <p class="eyebrow">Website-uri pentru cei<br />care lucrează cu copii</p>
          <h1 id="hero-title">Un website<br />pe măsura <span>grijii</span><br />pe care o pui în<br />munca ta<span>.</span></h1>
          <p class="hero__intro">Cald. Profesionist. Primitor.<br />Construit în jurul identității tale.</p>
        </div>
        <!-- Mockup cu website de psihologie pentru copii, afișat pe laptop și telefon. -->
        <img class="hero__visual" src="images/mockup-website-psihologie-copii-laptop-telefon-1200x1400.png" alt="Mockup al unui website de psihologie pentru copii, afișat pe laptop și telefon" title="Mockup website psihologie copii pe laptop și telefon — PNG recomandat: 1200 × 1400 px" />
        <!-- Element decorativ: inimă desenată manual, în coral. -->
        <img class="hero__heart" src="images/decor-inima-desenata-coral-96x96.png" alt="" title="Inimă decorativă desenată manual, coral — PNG recomandat: 96 × 96 px" />
        <!-- Element decorativ: ramură cu frunze, în tonuri mint. -->
        <img class="hero__leaf" src="images/decor-ramura-cu-frunze-mint-320x320.png" alt="" title="Ramură decorativă cu frunze în tonuri mint — PNG recomandat: 320 × 320 px" />
      </section>
    </main>
  </body>
</html>
